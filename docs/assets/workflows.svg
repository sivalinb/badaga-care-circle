<text x="502" y="780" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#14796b">SHARED CARE TASK / 02</text>
<text x="502" y="810" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#183747">Record helper acceptance</text>
<rect x="912" y="750" width="360" height="130" rx="16" fill="#e9f5ef" stroke="#14796b" stroke-width="1.6"/>
<text x="934" y="780" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#14796b">SHARED CARE TASK / 03</text>
