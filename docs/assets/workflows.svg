<polyline points="840,993 906,993" fill="none" stroke="#6b8591" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="1090" width="1224" height="76" rx="16" fill="#edf4f9" stroke="#24647d" stroke-width="1.6"/>
<text x="70" y="1120" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#24647d">LANGUAGE AND SCOPE</text>
<text x="70" y="1150" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#183747">Saved notes keep their original language; unsaved inputs clear when demo context changes.</text>
<text x="48" y="1185" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#526b77">No reminder, booking or remote helper acceptance is sent by this demo. Staffed pathways belong to the pilot roadmap.</text>
