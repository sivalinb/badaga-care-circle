<text x="70" y="948" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#976623">FAMILY BACKUP / 01</text>
<text x="70" y="978" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#183747">Choose two distinct adults</text>
<rect x="480" y="918" width="360" height="130" rx="16" fill="#fff5e5" stroke="#976623" stroke-width="1.6"/>
<text x="502" y="948" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#976623">FAMILY BACKUP / 02</text>
<text x="502" y="978" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#183747">Share routines and locations</text>
<rect x="912" y="918" width="360" height="130" rx="16" fill="#fff5e5" stroke="#976623" stroke-width="1.6"/>
