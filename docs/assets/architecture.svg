<text x="502" y="250" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#183747">Scoped CareService</text>
<text x="502" y="281" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#526b77">Household + role + consent</text>
<text x="502" y="305" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#526b77">Workflow ordering and fallbacks</text>
