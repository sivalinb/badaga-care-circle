<text x="70" y="281" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#526b77">Gradio Blocks and session state</text>
<text x="70" y="305" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#526b77">Residents, caretakers and reviewers</text>
