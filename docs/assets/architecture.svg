<text x="70" y="1010" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#a34c43">FUTURE CLINICAL PILOT GATE</text>
<text x="70" y="1040" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#183747">Named clinical owners + approved bilingual content + verified identity + protected storage</text>
<text x="48" y="1075" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#526b77">Demo role selectors are not authentication. Current software does not place calls, send messages or book care.</text>
