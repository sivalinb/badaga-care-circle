<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1100" viewBox="0 0 1320 1100" role="img" aria-labelledby="title desc">
<title id="title">Architecture: a small system with visible boundaries</title><desc id="desc">Gradio calls scoped CareService and a fixed safety gate. Education uses bilingual retrieval, optional consented OpenAI drafts, and human review before release. Fictional workflows and minimized traces persist in SQLite. Clinical pilot gates remain unmet.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="#6b8591"/></marker></defs>
