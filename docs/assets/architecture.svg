<text x="48" y="48" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#afe0cc">BADAGA CARE CIRCLE  /  FICTIONAL-DATA DEMO</text>
<text x="48" y="88" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Architecture: a small system with visible boundaries</text>
<text x="48" y="152" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#526b77">One local Python process; arrows show the main education path and review handover.</text>
