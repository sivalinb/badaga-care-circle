<text x="70" y="281" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#526b77">46 cases: 30 English / 16 Tamil</text>
<text x="70" y="305" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#526b77">30 cases marked critical</text>
<text x="70" y="329" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#526b77">Routes and expected source IDs</text>
