<text x="502" y="690" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#14796b">TRACE FIELD MINIMIZATION</text>
<text x="502" y="720" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#183747">Exclude raw private input</text>
