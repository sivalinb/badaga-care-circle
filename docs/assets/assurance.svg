<text x="70" y="952" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#183747">CI repeats tests + offline eval + documentation checks + expected blocked preflight.</text>
<rect x="48" y="1018" width="1224" height="112" rx="16" fill="#fcefeb" stroke="#a34c43" stroke-width="1.6"/>
<text x="70" y="1048" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#a34c43">KNOWN LIMITS</text>
<text x="70" y="1078" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#183747">No live-model quality score or external monitoring service is implemented.</text>
<text x="70" y="1109" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#526b77">Synthetic pass counts and token totals do not measure clinical efficacy or prevent sudden death.</text>
<text x="48" y="1185" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#526b77">See docs/evaluations.md and docs/observability.md for exact checks, trace fields, limitations and roadmap work.</text>
