<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1210" viewBox="0 0 1320 1210" role="img" aria-labelledby="title desc">
<title id="title">Assurance: software evidence, operational signals, human gates</title><desc id="desc">Three pillars describe software regression tests, minimized local request traces and metrics, and human clinical/language review gates. The build has 53 tests, 46 synthetic cases and 11 earlier browser checks. Live OpenAI and clinical field validation are absent.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="#6b8591"/></marker></defs>
<rect width="1320" height="100%" fill="#fafbf7"/>
<rect width="1320" height="126" fill="#183747"/>
<text x="48" y="48" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#afe0cc">BADAGA CARE CIRCLE  /  FICTIONAL-DATA DEMO</text>
<text x="48" y="88" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Assurance: software evidence, operational signals, human gates</text>
<text x="48" y="152" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#526b77">A passing regression suite does not establish clinical safety, fluent Tamil or delivered care.</text>
